name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CRM_ByBusiness/package-lock.json

      - name: Install dependencies
        working-directory: CRM_ByBusiness
        run: npm ci

      - name: Install Playwright
        working-directory: CRM_ByBusiness
        run: npx playwright install --with-deps chromium

      # Dockhand must be reachable at localhost:3000 for the 'dockhand' project
      # tests (auth.spec.js, agenda.spec.js, rbac.spec.js).
      - name: Start Dockhand
        working-directory: CRM_ByBusiness
        run: |
          docker run -d --name dockhand-test -p 3000:3000 fnsys/dockhand:latest
          for i in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Dockhand is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Dockhand failed to start within 60s"
          docker logs dockhand-test || true
          exit 1

      - name: Build
        working-directory: CRM_ByBusiness
        run: npm run build

      - name: Run E2E tests
        working-directory: CRM_ByBusiness
        env:
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: CRM_ByBusiness/playwright-report/
          retention-days: 7
