name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CRM_ByBusiness/package-lock.json

      - name: Install dependencies
        working-directory: CRM_ByBusiness
        run: npm ci

      - name: Install Playwright
        working-directory: CRM_ByBusiness
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: CRM_ByBusiness
        run: npm run build

      - name: Run E2E tests
        working-directory: CRM_ByBusiness
        env:
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: CRM_ByBusiness/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: CRM_ByBusiness/test-results/
          retention-days: 7
