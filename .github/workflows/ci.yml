name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CRM_ByBusiness/package-lock.json

      - name: Install dependencies
        working-directory: CRM_ByBusiness
        run: npm ci

      - name: Lint
        working-directory: CRM_ByBusiness
        run: npm run lint

      - name: Lint scope
        working-directory: CRM_ByBusiness
        run: npm run lint:scope

      - name: Build
        working-directory: CRM_ByBusiness
        run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CRM_ByBusiness/package-lock.json

      - name: Install dependencies
        working-directory: CRM_ByBusiness
        run: npm ci

      - name: Run unit tests
        working-directory: CRM_ByBusiness
        run: npm test
